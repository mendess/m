[workspace]
resolver = "3"
members = ["lib/*", "bin/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.86"
form_urlencoded = { version = "1.2.1", default-features = false }
arboard = "3.4.1"
arc-swap = "1.7.1"
async_once = "0.2.6"
base64 = "0.22"
chrono = "0.4.38"
clap = "4.5.4"
clap_complete = "4.5.2"
config = "0.15"
crossterm = "0.29.0"
csv-async = "1.3.0"
derive_more = "2.0.1"
dirs = "6.0.0"
futures-util = "0.3.30"
glob = "0.3.1"
itertools = "0.13.0"
levenshtein = "1.0.5"
memchr = "2.7.2"
mpris-server = "0.9.0"
parking_lot = "0.12.2"
pin-project = "1.1.5"
raii_flock = "0.2.0"
rand = "0.8.5"
regex = "1.10.4"
reqwest = "0.12.4"
rustyline = "15.0.0"
serde = "1.0.202"
serde-map-to-array = "3.0.0"
serde_json = "1.0.117"
static_assertions = "1.1.0"
tempfile = "3.10.1"
thiserror = "2"
tokio-stream = "0.1.15"
tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.18"
trait-gen = "2"
url = "2.5.0"
whoami = "1.5.1"
wl-clipboard-rs = "0.9.1"
zbus = { version = "5", default-features = false }

[workspace.dependencies.tokio]
version = "1.37.0"
default-features = false
features = ["macros", "rt-multi-thread", "rt", "parking_lot"]

[workspace.dependencies.namespaced-tmp]
git = "https://github.com/mendess/namespaced-tmp"
features = ["user", "async"]
