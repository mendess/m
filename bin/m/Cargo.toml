[package]
name = "m"
version = "0.7.3"
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
arboard = { optional = true, workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
cli-daemon = { path = "../../lib/cli-daemon" }
config = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
futures-util.workspace = true
itertools = { workspace = true }
levenshtein = { workspace = true }
rand = { workspace = true, features = ["getrandom"] }
regex.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream", "json"] }
rustyline = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio-stream = { workspace = true, features = ["io-util"] }
tracing-subscriber = { workspace = true, features = ["registry", "env-filter", "fmt"] }
tracing.workspace = true
wl-clipboard-rs = { optional = true, workspace = true }

[dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread", "rt", "parking_lot"]

[dependencies.mlib]
path = "../../lib/mlib"
default-features = false
features = [
    "ytdl",
    "player",
    "player-connection",
    "statistics",
    "playlist",
    "queue",
    "downloads"
]

[features]
clipboard = ["dep:wl-clipboard-rs", "dep:arboard"]
mpris = ["mlib/mpris"]
