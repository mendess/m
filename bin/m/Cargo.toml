[package]
name = "m"
version = "0.6.22"
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
arboard = { optional = true, workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
cli-daemon = { path = "../../lib/cli-daemon" }
config = { workspace = true }
crossterm = { workspace = true }
derive_more = { workspace = true }
dirs = { workspace = true }
futures-util.workspace = true
itertools = { workspace = true }
levenshtein = { workspace = true }
memchr.workspace = true
mlib = { path = "../../lib/mlib", default-features = true }
mpris-server = { workspace = true }
namespaced-tmp.workspace  = true
rand = { workspace = true, features = ["getrandom"] }
regex.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream", "json"] }
rustyline = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-map-to-array = { workspace = true }
serde_json.workspace = true
tempfile.workspace = true
thiserror = { workspace = true }
tokio-stream = { workspace = true, features = ["io-util"] }
tracing-log.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "env-filter", "fmt"] }
tracing.workspace = true
trait-gen = { workspace = true }
whoami.workspace = true
wl-clipboard-rs = { optional = true, workspace = true }
zbus = { workspace = true }

[dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread", "rt", "parking_lot"]

[features]
clipboard = ["dep:wl-clipboard-rs", "dep:arboard"]
